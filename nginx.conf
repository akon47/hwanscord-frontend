# Served inside the hwanscord-web container. The nginx gateway (LXC 101) terminates TLS for
# hwanscord.kimhwan.kr and proxies here (:80); this server proxies API/socket/uploads to the backend.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS; re-resolve so nginx starts (and recovers) even while the api container is down.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://hwanscord-api:8080;

    client_max_body_size 30m;
    server_tokens off;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/manifest+json;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=(self), display-capture=(self)" always;

    # forward the real client chain (gateway already sets X-Forwarded-For)
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

    location /api/ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_read_timeout 60s;
        proxy_request_buffering off;
    }

    location /socket.io/ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        # a location that sets any proxy_set_header no longer inherits the server-level ones → repeat them
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location /uploads/ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
    }

    location = /healthz {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        access_log off;
    }

    # hashed build assets: cache forever
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        types { }
        default_type application/manifest+json;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location = /favicon.ico {
        expires 7d;
        access_log off;
        try_files $uri =404;
    }

    # SPA fallback; index.html must never be cached so new deploys are picked up immediately
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
    }
}
